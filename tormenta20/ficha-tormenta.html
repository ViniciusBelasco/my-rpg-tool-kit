<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ficha Tormenta</title>
        <link href="./css/ficha.css" rel="stylesheet" />
    </head>
    <body>
        <div class="character-info">
            <div class="names">
                <fieldset>
                    <label for="char-name">Personagem:</label>
                    <input type="text" name="char-name" />
                    <label for="player-name">Jogador(a):</label>
                    <input type="text" name="player-name" />
                </fieldset>
            </div>
            <div class="other-info">
                <fieldset>
                    <div class="info">
                        <label for="char-race">Raça:</label>
                        <input type="text" name="char-race" />
                    </div>
                    <div class="info">
                        <label for="char-origin">Origem:</label>
                        <input type="text" name="char-origin" />
                    </div>
                    <div class="info">
                        <label for="char-class">Classe:</label>
                        <input type="text" name="char-class" />
                    </div>
                    <div class="info">
                        <label for="char-level">Nível:</label>
                        <input type="text" name="char-level" class="char-level" />
                    </div>
                    <div class="info">
                        <label for="char-divinity">Divindade:</label>
                        <input type="text" name="char-divinity" />
                    </div>
                </fieldset>
            </div>
        </div>
        <div class="character-status">
            <fieldset>
                <p>
                    <label for="char-strength">FOR</label>
                    <label for="char-dexterity">DES</label>
                    <label for="char-constitution">CON</label>
                    <label for="char-inteligence">INT</label>
                    <label for="char-wisdom">SAB</label>
                    <label for="char-charism">CAR</label>
                </p>
                <input type="text" name="char-strength" />
                <input type="text" name="char-dexterity" />
                <input type="text" name="char-constitution" />
                <input type="text" name="char-inteligence" />
                <input type="text" name="char-wisdom" />
                <input type="text" name="char-charism" />
            </fieldset>
        </div>
        <div class="abilities">
            <div>
                <fieldset>
                    <label for="max-hit-points">PV(max.)</label>
                    <input type="text" name="max-hit-points" />
                    <label for="hit-points">Pontos de vida</label>
                    <input type="text" name="hit-points" />
                    <label for="max-mana-points">PM(max.)</label>
                    <input type="text" name="max-mana-points" />
                    <label for="mana-points">Pontos de Mana</label>
                    <input type="text" name="mana-points" />
                </fieldset>
            </div>
            <div class="weapon status">
                <fieldset>
                    <p>Ataques</p>
                    <p>
                        <label for="weapon">Arma</label>
                        <label for="attack-roll">Atk Roll</label>
                        <label for="damage">Dano</label>
                        <label for="critical">Crítico</label>
                        <label for="damage-type">Tipo</label>
                        <label for="range">Alcance</label>
                    </p>
                    <input type="text" name="weapon" />
                    <input type="text" name="attack-roll" />
                    <input type="text" name="damage" />
                    <input type="text" name="critical" />
                    <input type="text" name="damage-type" />
                    <input type="text" name="range" />
                </fieldset>
            </div>
            <div class="status">
                <div class="status defense">
                    <fieldset>
                        <p>
                            <label for="defense">Defesa</label>
                            <label for="defense-dexterity">Destreza</label>
                            <label for="bonus-armour">Armadura</label>
                            <label for="bonus-shield">Escudo</label>
                            <label for="other-defense-bonus">Outros</label>
                        </p>
                        <input type="text" name="defense" />
                        <span>=10 +</span>
                        <input type="text" name="char-dexterity" />
                        <span>+</span>
                        <input type="text" name="bonus-armour" />
                        <span>+</span>
                        <input type="text" name="bonus-shield" />
                        <span>+</span>
                        <input type="text" name="other-defense-bonus" />
                        <p></p>
                        <label for="armour-and-shield">Armadura e escudo</label>
                        <label for="armour-defense">Defesa</label>
                        <label for="armour-shield">Penalidade</label>
                        <p></p>
                        <input type="text" />
                        <input type="text" name="armour-defense" />
                        <input type="text" name="armour-shield" />
                        <p>PROFICIÊNCIAS E OUTRAS CARACTERISTICAS</p>
                        <input type="text" name="armour-shield" />
                        <div>
                            <p>HABILIDADES E MAGIAS</p>
                            <input type="text" name="habilities" />
                        </div>
                        <div>
                            <p>EQUIPAMENTO</p>
                            <input type="text" name="equipments" />
                        </div>
                    </fieldset>
                </div>
            </div>
            <div class="skills">
                <fieldset>
                    <p>Pericias</p>
                    <label for="acrobatics">Acrobacia</label>
                    <input type="text" name="acrobatics" />
                    <p></p>
                    <label for="animal-handling">Adestramento</label>
                    <input type="text" name="animal-handling" />
                    <p></p>
                    <label for="athletics">Atletismo</label>
                    <input type="text" name="athletics" />
                    <p></p>
                    <label for="performance">Atuação</label>
                    <input type="text" name="performance" />
                    <p></p>
                    <label for="ride">Cavalgar</label>
                    <input type="text" name="ride" />
                    <p></p>
                    <label for="knowledge">Conhecimento</label>
                    <input type="text" name="knowledge" />
                    <p></p>
                    <label for="heal">Cura</label>
                    <input type="text" name="heal" />
                    <p></p>
                    <label for="diplomacy">Diplomacia</label>
                    <input type="text" name="diplomacy" />
                    <p></p>
                    <label for="deception">Enganação</label>
                    <input type="text" name="deception" />
                    <p></p>
                    <label for="fortitude">Fortitude</label>
                    <input type="text" name="fortitude" />
                    <p></p>
                    <label for="stealth">Furtividade</label>
                    <input type="text" name="stealth" />
                    <p></p>
                    <label for="war">Guerra</label>
                    <input type="text" name="war" />
                    <p></p>
                    <label for="initiative">Iniciativa</label>
                    <input type="text" name="initiative" />
                    <p></p>
                    <label for="intimidation">Intimidação</label>
                    <input type="text" name="intimidation" />
                    <p></p>
                    <label for="intuition">Intuição</label>
                    <input type="text" name="intuition" />
                    <p></p>
                    <label for="investigation">Investigação</label>
                    <input type="text" name="investigation" />
                    <p></p>
                    <label for="gambling">Jogatina</label>
                    <input type="text" name="gambling" />
                    <p></p>
                    <label for="thievery">Ladinagem</label>
                    <input type="text" name="thievery" />
                    <p></p>
                    <label for="fight">Luta</label>
                    <input type="text" name="fight" />
                    <p></p>
                    <label for="mysticism">Misticismo</label>
                    <input type="text" name="mysticism" />
                    <p></p>
                    <label for="nobility">Nobreza</label>
                    <input type="text" name="nobility" />
                    <p></p>
                    <label for="craft1">Ofício</label>
                    <input type="text" name="craft1" />
                    <p></p>
                    <label for="craft2">Ofício</label>
                    <input type="text" name="craft2" />
                    <p></p>
                    <label for="perception">Percepção</label>
                    <input type="text" name="perception" />
                    <p></p>
                    <label for="piloting">Pilotagem</label>
                    <input type="text" name="piloting" />
                    <p></p>
                    <label for="aim">Pontaria</label>
                    <input type="text" name="aim" />
                    <p></p>
                    <label for="reflexes">Reflexos</label>
                    <input type="text" name="reflexes" />
                    <p></p>
                    <label for="religion">Religião</label>
                    <input type="text" name="religion" />
                    <p></p>
                    <label for="survive">Sobrevivência</label>
                    <input type="text" name="survive" />
                    <p></p>
                    <label for="will-power">Vontade</label>
                    <input type="text" name="will-power" />
                </fieldset>
            </div>
        </div>
    </body>
</html>
